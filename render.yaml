services:
  # Backend API Web Service (using Docker)
  - type: web
    name: trustvault-api
    env: docker
    plan: starter
    disk:
      name: trustvault-storage
      mountPath: /var/data/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: DB_MIGRATION_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: STORAGE_DIRECTORY
        value: /var/data/storage
      - key: MASTER_KEY
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
  # Frontend UI Static Site
  - type: web
    name: trustvault-ui
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: TRUSTVAULT_API_TARGET
        fromService:
          type: web
          name: trustvault-api
          property: url
databases:
  - name: trustvault-db
    databaseName: trustvault
    databaseUser: trustvault_user
    plan: starter
