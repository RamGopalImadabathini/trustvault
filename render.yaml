services:
  - type: web
    name: trustvault
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: trustvault-storage
      mountPath: /var/data/storage
      sizeGB: 1
    envVars:
      - key: DB_MIGRATION_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_DIRECTORY
        value: /var/data/storage
      - key: MALWARE_SCANNER
        value: local-basic
      - key: MASTER_KEY
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: trustvault-db
    databaseName: trustvault
    user: trustvault_owner
    plan: basic-256mb
